name: Analytics CI

on:
  push:
    branches: [master, upgrade/data-analytics-bi]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dashboard dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask==2.3.3 pandas==2.0.3 numpy==1.24.3 pytest scikit-learn==1.3.0

      - name: Run tests
        run: python -m pytest -q
